# ===================================================================
# Sri Venkateshwara Swamy Temple (DivineConnect) - Backend Configuration
# Spring Boot 3.2.4 & MySQL 8.0
# ===================================================================

# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=srivari-temple-backend

# MySQL 8.0 Database Connection
# Uses DB_URL / DB_USERNAME / DB_PASSWORD for Cloud Deployment with local defaults
spring.datasource.url=${DB_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/divineconnect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Auto-updates tables to match entities)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson Date & Time Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# SMS Gateway Configuration (Real Mobile OTP Delivery)
# ===================================================================
sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
