# ===================================================================
# Sri Venkateshwara Swamy Temple (DivineConnect) - Backend Configuration
# Spring Boot 3.2.4 & MySQL 8.0
# ===================================================================

# Server Configuration (Respects Render/Cloud dynamic PORT)
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=srivari-temple-backend

# MySQL 8.0 Database Connection
# Supports DB_URL, DATABASE_URL, SPRING_DATASOURCE_URL, MYSQL_URL, and url
spring.datasource.url=${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:${MYSQL_URL:${url:jdbc:mysql://localhost:3306/divineconnect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}}}}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:${username:root}}}}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:${password:root}}}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Explicit MySQL Dialect)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hikari Connection Pool Settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Jackson Date & Time Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# SMS Gateway Configuration (Real Mobile OTP Delivery)
# ===================================================================
sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
